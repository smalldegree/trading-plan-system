# 交易计划记录系统 Nginx 站点配置
# 部署方式：include 方式（deploy.sh 会复制到 /etc/nginx/sites-available 并替换占位路径/域名/端口）
# 说明：前端静态文件由 Nginx 托管，/api 反向代理到 Node 后端（127.0.0.1:3000）

upstream trading_plan_backend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name your-domain.com;

    # 前端静态文件（Vue 构建产物）
    root /var/www/html/trading-plan-system/web/dist;
    index index.html;

    # 前端 SPA（history 路由回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 RESTful API
    location /api/ {
        proxy_pass http://trading_plan_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
